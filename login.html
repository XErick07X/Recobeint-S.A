<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirigiendo al portal Super Cliente</title>
  <script>
    var target = '/supercliente' + window.location.search + window.location.hash;
    window.location.replace(target);
  </script>
</head>
<body>
  <p>Redirigiendo al portal Super Cliente...</p>
  <p>Si no te redirige, haz clic <a id="manualLink" href="/supercliente">aquí</a>.</p>
  <script>
    document.getElementById('manualLink').href = '/supercliente' + window.location.search + window.location.hash;
  </script>
</body>
</html>
